name: Build APK

# A version is a git tag: push the tag "v1.2" (the same number as "version" in package.json, shortened) and GitHub builds,
# signs and publishes AB-Sales-v1.2.apk. Pushing ordinary commits to main builds nothing. "Run workflow" (Actions tab) builds
# a test APK without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The workflow only reads the code ...
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # ... except this job, which may publish the release page with the APK
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: The tag must match the app version
        run: |
          V=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but package.json says version $V (shown as v$V). Change one of them so they match."
            exit 1
          fi
      - run: npm ci
      # the build stops here if a security, data-compatibility or logic test fails
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            # An APK signed with any other key cannot be installed over the app on the phones: the only way out would be
            # to uninstall, which deletes the data. So no key = no APK.
            echo "::error::The signing secrets are missing. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/ab-sales.p12" || {
            echo "::error::KEYSTORE_BASE64 is not valid base64. Paste the full text of KEYSTORE_BASE64.txt (not the password, not the file path)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/ab-sales.p12" -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" > /dev/null || {
            echo "::error::Keystore could not be opened. Check KEYSTORE_PASSWORD matches KEYSTORE_PASSWORD.txt exactly."; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ab-sales.p12" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Name the APK after the app version
        id: apk
        run: |
          V=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          F=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$F" "AB-Sales-v$V.apk"
          echo "name=AB-Sales-v$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 30
      # The release page holds the plain .apk (an artifact is a zip): this is the link to open on the phone.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.name }}.apk
        run: |
          NOTES="Install this APK OVER the old app (never uninstall: the data would be deleted). Build number ${GITHUB_RUN_NUMBER}."
          gh release create "$GITHUB_REF_NAME" "$APK" --title "AB Sales $GITHUB_REF_NAME" --notes "$NOTES" \
            || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
